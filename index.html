<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT 2026 — Tribunales DAT Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F3EE;
  --surface:#FFFFFF;
  --surface2:#F0EDE6;
  --border:#DDD9CE;
  --border2:#E8E4DC;
  --text:#1C1A17;
  --muted:#8A8680;
  --muted2:#B5B2AB;
  --accent:#1D5FB0;
  --accent-bg:#EAF1FC;
  --accent-border:#9EC3F0;
  --green:#0A6E50;
  --green-bg:#E2F2EC;
  --green-border:#6DCAAD;
  --amber:#7A4A00;
  --amber-bg:#FFF3DC;
  --amber-border:#FFCC6B;
  --pink:#8C1A3E;
  --pink-bg:#FCEEF4;
  --pink-border:#F0A0C0;
  --violet:#3D2E9E;
  --violet-bg:#F0EEFF;
  --violet-border:#B8AEFF;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Syne',sans-serif;
}
html{font-size:14px}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}

/* ─── LAYOUT ─── */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.5rem;background:var(--text);border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:100}
.topbar-title{font-size:1rem;font-weight:800;color:#fff;letter-spacing:-.5px}
.topbar-title span{color:#7FB8F5}
.tab-switcher{display:flex;gap:4px;background:#2D2A26;border-radius:8px;padding:3px}
.tab-btn{padding:5px 16px;border-radius:6px;border:none;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:#aaa;background:transparent;letter-spacing:.2px}
.tab-btn.active{background:#1D5FB0;color:#fff}
.tab-btn:not(.active):hover{background:#3D3A36;color:#fff}
.main{flex:1;padding:1.25rem 1.5rem;max-width:1280px;margin:0 auto;width:100%}

/* ─── STAT CARDS ─── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.7rem 1rem}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:22px;font-weight:800;color:var(--text)}
.stat-val.blue{color:var(--accent)}
.stat-val.green{color:var(--green)}
.stat-val.amber{color:#C07800}

/* ─── FILTER BAR ─── */
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem;align-items:center}
.filterbar input[type=text]{flex:1 1 200px;min-width:160px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:13px;background:var(--surface);outline:none}
.filterbar input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,95,176,.15)}
.filterbar select{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-family:var(--sans);font-size:13px;cursor:pointer;outline:none}
.filterbar select:focus{border-color:var(--accent)}
.btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-family:var(--sans);font-size:13px;cursor:pointer;font-weight:600;transition:background .1s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#175A9A}

/* ─── TABLE ─── */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto;margin-bottom:1rem;max-height:calc(100vh - 260px)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:9px 10px;text-align:left;font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:10}
thead th:hover{color:var(--text)}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFAF7}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted2)}

/* ─── BADGES ─── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.2px}
.b-repo{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border)}
.b-estab{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.b-nc{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.b-pres{background:var(--pink-bg);color:var(--pink);border:1px solid var(--pink-border)}
.b-vocal{background:var(--violet-bg);color:var(--violet);border:1px solid var(--violet-border)}
.b-pov{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.b-tit{background:#EAF7EE;color:#0A6033;border:1px solid #8BCFAA;font-size:10px}
.b-sup{background:#FFF5E0;color:#7A5200;border:1px solid #FFCC6B;font-size:10px}
.hist-pill{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;background:#F0EDE6;color:#5A5750;border:1px solid var(--border)}
.hist-pill.matched{background:#EAF1FC;color:#1D5FB0;border-color:#9EC3F0}

/* ─── PAGINATION ─── */
.pag{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding-bottom:.5rem}
.pag-btns{display:flex;gap:6px}
.pag button{padding:4px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-family:var(--sans);font-size:12px;cursor:pointer}
.pag button:disabled{opacity:.4;cursor:default}
.pag button:not(:disabled):hover{background:var(--surface2)}

/* ─── TRIBUNAL VIEW ─── */
.trib-layout{display:grid;grid-template-columns:220px 1fr;gap:1.25rem;align-items:start}
.trib-nav{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:sticky;top:72px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.trib-nav-header{padding:.75rem 1rem;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--surface2)}
.trib-nav-search{padding:8px 10px;border-bottom:1px solid var(--border2)}
.trib-nav-search input{width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:12px;background:var(--bg);outline:none}
.trib-nav-search input:focus{border-color:var(--accent)}
.trib-list{overflow-y:auto;flex:1}
.trib-item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--border2);font-size:13px;transition:background .1s}
.trib-item:last-child{border-bottom:none}
.trib-item:hover{background:var(--surface2)}
.trib-item.active{background:var(--accent-bg);color:var(--accent);font-weight:700}
.trib-num{font-family:var(--mono);font-size:12px;font-weight:600}
.trib-pres-name{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.trib-item.active .trib-pres-name{color:#5A9FE0}
.trib-hit-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-left:4px}

.trib-detail{min-width:0}
.trib-detail-header{display:flex;align-items:baseline;gap:1rem;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:2px solid var(--border)}
.trib-detail-num{font-size:2.5rem;font-weight:800;color:var(--text);line-height:1;font-family:var(--mono)}
.trib-detail-meta{flex:1}
.trib-detail-meta h2{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:2px}
.trib-detail-meta p{font-size:12px;color:var(--muted)}

.trib-blocks{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.trib-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.trib-block-header{padding:.6rem 1rem;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border2)}
.trib-block-header.titulares{background:#EDFAF4;color:#0A6033}
.trib-block-header.suplentes{background:#FFF9EC;color:#7A4A00}
.trib-member{display:flex;flex-direction:column;padding:.6rem 1rem;border-bottom:1px solid var(--border2);gap:3px}
.trib-member:last-child{border-bottom:none}
.trib-member-top{display:flex;align-items:center;gap:6px}
.trib-member-name{font-size:13px;font-weight:600;flex:1}
.trib-member-cargo{font-size:10px}
.trib-member-hist{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hist-info{display:flex;align-items:center;gap:4px}
.hist-trib-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:1px 6px;border-radius:4px;border:1px solid var(--accent-border)}
.hist-cargo-info{font-size:11px;color:var(--muted)}
.no-hist{font-size:11px;color:var(--muted2);font-style:italic}
.highlight-pres .trib-member-name{color:var(--pink)}

/* ─── EMPTY STATE ─── */
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-icon{font-size:2rem;margin-bottom:.5rem}

/* ─── SORT ICON ─── */
.sort-icon{font-size:9px;margin-left:3px;opacity:.35}
.sort-icon.active{opacity:1;color:var(--accent)}

/* ─── RESPONSIVE ─── */
@media(max-width:760px){
  .trib-layout{grid-template-columns:1fr}
  .trib-blocks{grid-template-columns:1fr}
  .trib-nav{position:static;max-height:200px}
  .main{padding:.75rem}
  .stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
  <div class="topbar-title">PT 2026 — <span>Tribunales DAT Norte</span></div>
  <div class="tab-switcher">
    <button class="tab-btn active" id="tabPersonas" onclick="setTab('personas')">👤 Por Persona</button>
    <button class="tab-btn" id="tabTribunales" onclick="setTab('tribunales')">⚖️ Por Tribunal</button>
  </div>
</div>
<div class="main">

<!-- ── VISTA POR PERSONA ── -->
<div id="viewPersonas">
  <div class="stats" id="statsPersonas"></div>
  <div class="filterbar">
    <input type="text" id="search" placeholder="Buscar nombre, apellido o NIF…">
    <select id="fTrib26"><option value="">Tribunal 2026: Todos</option></select>
    <select id="fProc"><option value="">Proceso 2024: Todos</option><option>Reposición</option><option>Estabilización</option><option>No consta</option></select>
    <select id="fCargo26"><option value="">Cargo 2026: Todos</option><option>VOCAL</option><option>PRESIDENTE</option><option>PRESIDENTE O VOCAL</option></select>
    <select id="fTipo26"><option value="">Tipo 2026: Todos</option><option>Titular</option><option>Suplente</option></select>
    <button class="btn" onclick="resetFilters()">Limpiar</button>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pag" id="pag"></div>
</div>

<!-- ── VISTA POR TRIBUNAL ── -->
<div id="viewTribunales" style="display:none">
  <div class="stats" id="statsTribunales"></div>
  <div class="trib-layout">
    <div class="trib-nav">
      <div class="trib-nav-header">82 Tribunales 2026</div>
      <div class="trib-nav-search"><input type="text" id="tribSearch" placeholder="Buscar tribunal o presidente…" oninput="filterTribNav()"></div>
      <div class="trib-list" id="tribList"></div>
    </div>
    <div class="trib-detail" id="tribDetail"></div>
  </div>
</div>

</div><!-- /main -->
</div><!-- /app -->

, "VICO", "GARCIA", "AMELIA", "VOCAL", "Estabilización", "13", "Vocal Titular"]], "2722": [["****2722*", "VIDAL", "LOSADA", "LORENA", "VOCAL", "No consta", "", ""]], "8484": [["****8484*", "VILLA", "LAZARO", "MARIA MAR", "PRESIDENTE", "Reposición", "53", "Presidente Titular"]], "9663": [["****9663*", "VIME", "LOPEZ", "LAURA", "VOCAL", "No consta", "", ""]], "3136": [["****3136*", "VIZCAINO", "DE LA FLOR", "MARTA", "VOCAL", "No consta", "", ""]], "7805": [["****7805*", "ZAFRA", "SAIZ", "LAURA", "PRESIDENTE O VOCAL", "Reposición", "16", "Vocal Titular"]], "9246": [["****9246*", "ZAMUDIO", "NAVARRO", "MAITE", "PRESIDENTE", "Estabilización", "19", "Vocal Titular"]], "6293": [["****6293*", "ZAPATA", "LONGARES", "PATRICIA", "PRESIDENTE", "Estabilización", "22", "Presidente Titular"]], "2147": [["****2147*", "ZARAGOZA", "VALERO", "LUCIA", "VOCAL", "No consta", "", ""]], "0465": [["****0465*", "ZOIDO", "RASTROJO", "MERCEDES", "VOCAL", "No consta", "", ""]]};


// ─── BUILD ENRICHED PERSONA DATA ───
// T2026: [tribunalNum, dni, nombre, cargo, tipo]
// RAW: [nif, ap1, ap2, nom, cargo26old, proc24, trib24, cargo24]
// HIST: {dni4: [[nif,ap1,ap2,nom,cargo26old,proc24,trib24,cargo24],...]}

// Build tribunal 2026 info by DNI (for persona view)
const trib26ByDni = {};
for(const row of T2026){
  const [tnum, dni, nombre, cargo, tipo] = row;
  if(!trib26ByDni[dni]) trib26ByDni[dni] = [];
  trib26ByDni[dni].push({tnum, cargo, tipo, nombre});
}

// Enrich RAW with tribunal 2026 info
// RAW columns: nif, ap1, ap2, nom, cargo26, proc24, trib24, cargo24
const DATA = RAW.map(r => {
  const nif = r[0];
  const dni4 = nif.replace(/\*/g,'').trim();
  const t26 = trib26ByDni[dni4] || [];
  return {
    nif, ap1:r[1], ap2:r[2], nom:r[3],
    cargo26:r[4], proc24:r[5], trib24:r[6]||'', cargo24:r[7]||'',
    trib26entries: t26,  // can be multiple (DNI duplicates)
    trib26num: t26.length>0 ? t26[0].tnum : '',
    tipo26: t26.length>0 ? t26[0].tipo : '',
    cargoTrib26: t26.length>0 ? t26[0].cargo : ''
  };
});

// Build tribunal structure
const TRIBUNALES = {};
for(const row of T2026){
  const [tnum, dni, nombre, cargo, tipo] = row;
  if(!TRIBUNALES[tnum]) TRIBUNALES[tnum] = {num:tnum, members:[]};
  const hist = HIST[dni] || [];
  TRIBUNALES[tnum].members.push({
    tnum, dni, nombre, cargo, tipo, hist
  });
}

const TRIB_LIST = Object.values(TRIBUNALES).sort((a,b)=>a.num-b.num);

// ─── TAB MANAGEMENT ───
let currentTab = 'personas';
function setTab(tab){
  currentTab = tab;
  document.getElementById('viewPersonas').style.display = tab==='personas' ? '' : 'none';
  document.getElementById('viewTribunales').style.display = tab==='tribunales' ? '' : 'none';
  document.getElementById('tabPersonas').classList.toggle('active', tab==='personas');
  document.getElementById('tabTribunales').classList.toggle('active', tab==='tribunales');
  if(tab==='tribunales') renderTribView();
  else render();
}

// ─── POPULATE TRIBUNAL FILTER IN PERSONA VIEW ───
const tribNums = [...new Set(T2026.map(r=>r[0]))].sort((a,b)=>a-b);
const fTrib26 = document.getElementById('fTrib26');
tribNums.forEach(n => {
  const opt = document.createElement('option');
  opt.value = n;
  opt.textContent = `Tribunal ${n}`;
  fTrib26.appendChild(opt);
});

// ─── PERSONA VIEW ───
const PER_PAGE = 30;
let page = 0, sortCol = null, sortDir = 'asc';

const cols = [
  ['nif','NIF'],['ap1','1er Apellido'],['ap2','2o Apellido'],['nom','Nombre'],
  ['trib26num','Trib. 2026'],['cargoTrib26','Cargo 2026'],['tipo26','Tipo 2026'],
  ['proc24','Proc. 2024'],['trib24','Trib. 2024'],['cargo24','Cargo 2024']
];

function getFiltered(){
  let d = DATA;
  const s = document.getElementById('search').value.toUpperCase();
  if(s) d = d.filter(r=>(r.ap1+' '+r.ap2+' '+r.nom+' '+r.nif).toUpperCase().includes(s));
  const ft = document.getElementById('fTrib26').value;
  if(ft) d = d.filter(r => r.trib26entries.some(e => e.tnum == ft));
  const fp = document.getElementById('fProc').value;
  if(fp) d = d.filter(r=>r.proc24===fp);
  const fc = document.getElementById('fCargo26').value;
  if(fc) d = d.filter(r=>r.cargo26===fc);
  const fti = document.getElementById('fTipo26').value;
  if(fti) d = d.filter(r=>r.tipo26===fti);
  if(sortCol){
    d = [...d].sort((a,b)=>{
      let va=a[sortCol]||'', vb=b[sortCol]||'';
      if(sortCol==='trib24'||sortCol==='trib26num'){va=parseInt(va)||9999;vb=parseInt(vb)||9999}
      if(va<vb) return sortDir==='asc'?-1:1;
      if(va>vb) return sortDir==='asc'?1:-1;
      return 0;
    });
  }
  return d;
}

function badgeProc(v){
  if(v==='Reposición') return '<span class="badge b-repo">Reposición</span>';
  if(v==='Estabilización') return '<span class="badge b-estab">Estabilización</span>';
  return '<span class="badge b-nc">Sin historial</span>';
}
function badgeCargo(v){
  if(!v) return '<span class="muted">—</span>';
  if(v==='Presidente') return '<span class="badge b-pres">Pres.</span>';
  if(v==='Vocal') return '<span class="badge b-vocal">Vocal</span>';
  return '<span class="muted" style="font-size:11px">'+v+'</span>';
}
function badgeTipo(v){
  if(v==='Titular') return '<span class="badge b-tit">Tit.</span>';
  if(v==='Suplente') return '<span class="badge b-sup">Sup.</span>';
  return '<span class="muted">—</span>';
}

function render(){
  const filtered = getFiltered();
  const repo = filtered.filter(r=>r.proc24==='Reposición').length;
  const estab = filtered.filter(r=>r.proc24==='Estabilización').length;
  const nc = filtered.filter(r=>r.proc24==='No consta').length;
  const enT26 = filtered.filter(r=>r.trib26num!=='').length;

  document.getElementById('statsPersonas').innerHTML =
    `<div class="stat"><div class="stat-label">Total filtrado</div><div class="stat-val">${filtered.length}</div></div>`+
    `<div class="stat"><div class="stat-label">En tribunal 2026</div><div class="stat-val blue">${enT26}</div></div>`+
    `<div class="stat"><div class="stat-label">Reposición 2024</div><div class="stat-val blue">${repo}</div></div>`+
    `<div class="stat"><div class="stat-label">Estabilización 2024</div><div class="stat-val green">${estab}</div></div>`+
    `<div class="stat"><div class="stat-label">Sin historial</div><div class="stat-val amber">${nc}</div></div>`;

  document.getElementById('thead').innerHTML = cols.map(([k,l])=>{
    const active = sortCol===k;
    const arrow = active?(sortDir==='asc'?'↑':'↓'):'↕';
    return `<th onclick="doSort('${k}')">${l}<span class="sort-icon${active?' active':''}">${arrow}</span></th>`;
  }).join('');

  const start = page * PER_PAGE;
  const pageData = filtered.slice(start, start+PER_PAGE);

  document.getElementById('tbody').innerHTML = pageData.map(r => {
    const t26cell = r.trib26num
      ? `<span class="hist-trib-num">${r.trib26num}</span>`
      : '<span class="muted">—</span>';
    return `<tr>
      <td class="mono">${r.nif}</td>
      <td style="font-weight:700">${r.ap1}</td>
      <td>${r.ap2}</td>
      <td>${r.nom}</td>
      <td style="text-align:center">${t26cell}</td>
      <td>${badgeCargo(r.cargoTrib26)}</td>
      <td>${badgeTipo(r.tipo26)}</td>
      <td>${badgeProc(r.proc24)}</td>
      <td style="text-align:center;font-weight:${r.trib24?600:400};color:${r.trib24?'var(--text)':'var(--muted2)'}">
        ${r.trib24 ? `<span class="hist-trib-num">${r.trib24}</span>` : '—'}
      </td>
      <td style="font-size:12px;color:${r.cargo24?'var(--text)':'var(--muted2)'}">${r.cargo24||'—'}</td>
    </tr>`;
  }).join('');

  const totalPages = Math.ceil(filtered.length/PER_PAGE);
  document.getElementById('pag').innerHTML =
    `<span>Mostrando ${start+1}–${Math.min(start+PER_PAGE,filtered.length)} de ${filtered.length}</span>`+
    `<div class="pag-btns">
      <button onclick="changePage(-1)"${page===0?' disabled':''}>← Anterior</button>
      <button onclick="changePage(1)"${page>=totalPages-1?' disabled':''}>Siguiente →</button>
    </div>`;
}

function doSort(col){
  if(sortCol===col) sortDir = sortDir==='asc'?'desc':'asc';
  else {sortCol=col; sortDir='asc'}
  render();
}
function changePage(d){page+=d;render()}
function resetFilters(){
  document.getElementById('search').value='';
  document.getElementById('fTrib26').value='';
  document.getElementById('fProc').value='';
  document.getElementById('fCargo26').value='';
  document.getElementById('fTipo26').value='';
  sortCol=null; page=0; render();
}
['search','fTrib26','fProc','fCargo26','fTipo26'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{page=0;render()});
  document.getElementById(id).addEventListener('change',()=>{page=0;render()});
});

// ─── TRIBUNAL VIEW ───
let selectedTrib = 1;
let tribNavFilter = '';

function filterTribNav(){
  tribNavFilter = document.getElementById('tribSearch').value.toUpperCase();
  renderTribNav();
}

function renderTribNav(){
  const list = document.getElementById('tribList');
  const items = TRIB_LIST.filter(t => {
    if(!tribNavFilter) return true;
    const numStr = String(t.num);
    const pres = t.members.find(m=>m.cargo==='Presidente'&&m.tipo==='Titular');
    const presName = pres ? pres.nombre : '';
    return numStr.includes(tribNavFilter) || presName.toUpperCase().includes(tribNavFilter);
  });

  list.innerHTML = items.map(t => {
    const pres = t.members.find(m=>m.cargo==='Presidente'&&m.tipo==='Titular');
    const presName = pres ? pres.nombre.split(',')[0] : '—';
    const hasHist = t.members.some(m=>m.hist.length>0);
    return `<div class="trib-item${t.num===selectedTrib?' active':''}" onclick="selectTrib(${t.num})">
      <div>
        <div class="trib-num">T-${String(t.num).padStart(2,'0')}</div>
        <div class="trib-pres-name">${presName}</div>
      </div>
      ${hasHist?'<div class="trib-hit-dot" title="Tiene historial 2024"></div>':''}
    </div>`;
  }).join('');
}

function selectTrib(num){
  selectedTrib = num;
  renderTribNav();
  renderTribDetail();
}

function renderTribDetail(){
  const t = TRIBUNALES[selectedTrib];
  if(!t){
    document.getElementById('tribDetail').innerHTML='<div class="empty"><div class="empty-icon">⚖️</div><p>Selecciona un tribunal</p></div>';
    return;
  }

  const titulares = t.members.filter(m=>m.tipo==='Titular');
  const suplentes = t.members.filter(m=>m.tipo==='Suplente');
  const pres = titulares.find(m=>m.cargo==='Presidente');
  const presName = pres ? pres.nombre : '—';
  const withHist = t.members.filter(m=>m.hist.length>0).length;

  const renderMember = (m) => {
    const isPres = m.cargo === 'Presidente';
    const histItems = m.hist.map(h => {
      const [nif,ap1,ap2,nom,cargo26old,proc24,trib24,cargo24] = h;
      const procBadge = proc24==='Reposición'?'<span class="badge b-repo" style="font-size:10px">Rep</span>':
                        proc24==='Estabilización'?'<span class="badge b-estab" style="font-size:10px">Est</span>':'';
      return `<div class="hist-info">
        ${trib24 ? `<span class="hist-trib-num" title="Tribunal 2024">T${trib24}</span>` : ''}
        ${procBadge}
        ${cargo24 ? `<span class="hist-cargo-info">${cargo24}</span>` : ''}
      </div>`;
    }).join('');

    return `<div class="trib-member${isPres?' highlight-pres':''}">
      <div class="trib-member-top">
        <span class="trib-member-name">${m.nombre}</span>
        <span class="trib-member-cargo">${isPres?'<span class="badge b-pres">Pres.</span>':'<span class="badge b-vocal" style="font-size:10px">Vocal</span>'}</span>
        <span class="mono muted" style="font-size:11px">${m.dni}</span>
      </div>
      <div class="trib-member-hist">
        ${m.hist.length>0 ? histItems : '<span class="no-hist">Sin historial 2024</span>'}
      </div>
    </div>`;
  };

  document.getElementById('tribDetail').innerHTML = `
    <div class="trib-detail-header">
      <div class="trib-detail-num">${String(selectedTrib).padStart(2,'0')}</div>
      <div class="trib-detail-meta">
        <h2>${presName.split(',').reverse().join(' ').trim()}</h2>
        <p>${withHist} de ${t.members.length} miembros con historial 2024 · ${titulares.length} titulares · ${suplentes.length} suplentes</p>
      </div>
    </div>
    <div class="trib-blocks">
      <div class="trib-block">
        <div class="trib-block-header titulares">✅ Titulares</div>
        ${titulares.map(renderMember).join('')}
      </div>
      <div class="trib-block">
        <div class="trib-block-header suplentes">🔄 Suplentes</div>
        ${suplentes.map(renderMember).join('')}
      </div>
    </div>
  `;
}

function renderTribView(){
  // Stats for tribunal view
  const totalPersons = T2026.length;
  const uniqueDnis = new Set(T2026.map(r=>r[1])).size;
  const withHist = T2026.filter(r=>HIST[r[1]]&&HIST[r[1]].length>0).length;
  const pres = T2026.filter(r=>r[3]==='Presidente').length;

  document.getElementById('statsTribunales').innerHTML =
    `<div class="stat"><div class="stat-label">Tribunales</div><div class="stat-val">${TRIB_LIST.length}</div></div>`+
    `<div class="stat"><div class="stat-label">Total asignaciones</div><div class="stat-val">${totalPersons}</div></div>`+
    `<div class="stat"><div class="stat-label">Personas únicas</div><div class="stat-val">${uniqueDnis}</div></div>`+
    `<div class="stat"><div class="stat-label">Con historial 2024</div><div class="stat-val blue">${withHist}</div></div>`+
    `<div class="stat"><div class="stat-label">Presidencias</div><div class="stat-val">${pres}</div></div>`;

  renderTribNav();
  renderTribDetail();
}

// ─── INIT ───
render();
</script>
