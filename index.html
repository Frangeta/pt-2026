  const s=document.getElementById("search").value.toUpperCase();
  if(s)d=d.filter(r=>(r.ap1+" "+r.ap2+" "+r.nom+" "+r.nif).toUpperCase().includes(s));
  const fp=document.getElementById("fProc").value;
  if(fp)d=d.filter(r=>r.proc24===fp);
  const fc=document.getElementById("fCargo26").value;
  if(fc)d=d.filter(r=>r.cargo26===fc);
  const f4=document.getElementById("fCargo24").value;
  if(f4)d=d.filter(r=>r.cargo24.includes(f4));
  if(sortCol){
    d=[...d].sort((a,b)=>{
      let va=a[sortCol]||"",vb=b[sortCol]||"";
      if(sortCol==="trib24"){va=parseInt(va)||999;vb=parseInt(vb)||999}
      if(va<vb)return sortDir==="asc"?-1:1;
      if(va>vb)return sortDir==="asc"?1:-1;
      return 0;
    });
  }
  return d;
}

function badgeProc(v){
  if(v==="Reposición")return'<span class="badge b-repo">Reposición</span>';
  if(v==="Estabilización")return'<span class="badge b-estab">Estabilización</span>';
  return'<span class="badge b-nc">No consta</span>';
}
function badgeCargo(v){
  if(v==="PRESIDENTE")return'<span class="badge b-pres">Presidente</span>';
  if(v==="VOCAL")return'<span class="badge b-vocal">Vocal</span>';
  return'<span class="badge b-pov">Pres. o Vocal</span>';
}

function render(){
  const filtered=getFiltered();
  const repo=filtered.filter(r=>r.proc24==="Reposición").length;
  const estab=filtered.filter(r=>r.proc24==="Estabilización").length;
  const nc=filtered.filter(r=>r.proc24==="No consta").length;

  document.getElementById("cards").innerHTML=
    `<div class="card"><div class="card-label">Total filtrado</div><div class="card-val">${filtered.length}</div></div>`+
    `<div class="card"><div class="card-label">Reposición</div><div class="card-val" style="color:#185FA5">${repo}</div></div>`+
    `<div class="card"><div class="card-label">Estabilización</div><div class="card-val" style="color:#0F6E56">${estab}</div></div>`+
    `<div class="card"><div class="card-label">Sin historial</div><div class="card-val" style="color:#888">${nc}</div></div>`;

  document.getElementById("thead").innerHTML=cols.map(([k,l])=>{
    const active=sortCol===k;
    const arrow=active?(sortDir==="asc"?"↑":"↓"):"↕";
    return`<th onclick="doSort('${k}')">${l}<span class="sort-icon${active?' active':''}">${arrow}</span></th>`;
  }).join("");

  const start=page*PER_PAGE;
  const pageData=filtered.slice(start,start+PER_PAGE);
  document.getElementById("tbody").innerHTML=pageData.map(r=>
    `<tr><td class="mono">${r.nif}</td><td style="font-weight:600">${r.ap1}</td><td>${r.ap2}</td><td>${r.nom}</td>`+
    `<td>${badgeCargo(r.cargo26)}</td><td>${badgeProc(r.proc24)}</td>`+
    `<td style="text-align:center;font-weight:${r.trib24?600:400};color:${r.trib24?'#1a1a1a':'#ccc'}">${r.trib24||"—"}</td>`+
    `<td style="font-size:12px;color:${r.cargo24?'#1a1a1a':'#ccc'}">${r.cargo24||"—"}</td></tr>`
  ).join("");

  const totalPages=Math.ceil(filtered.length/PER_PAGE);
  document.getElementById("pag").innerHTML=
    `<span>Mostrando ${start+1}–${Math.min(start+PER_PAGE,filtered.length)} de ${filtered.length}</span>`+
    `<div><button onclick="changePage(-1)"${page===0?" disabled":""}>← Anterior</button>`+
    `<button onclick="changePage(1)"${page>=totalPages-1?" disabled":""}>Siguiente →</button></div>`;
}

function doSort(col){
  if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";
  else{sortCol=col;sortDir="asc"}
  render();
}
function changePage(d){page+=d;render()}
function resetFilters(){
  document.getElementById("search").value="";
  document.getElementById("fProc").value="";
  document.getElementById("fCargo26").value="";
  document.getElementById("fCargo24").value="";
  sortCol=null;page=0;render();
}

document.getElementById("search").addEventListener("input",()=>{page=0;render()});
document.getElementById("fProc").addEventListener("change",()=>{page=0;render()});
document.getElementById("fCargo26").addEventListener("change",()=>{page=0;render()});
document.getElementById("fCargo24").addEventListener("change",()=>{page=0;render()});

render();
</script>
</body>
</html>
